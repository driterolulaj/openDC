# SPDX-License-Identifier: AGPL-3.0-only
# Push/PR CI (ADR-0015 §6): lint, typecheck, generated-file and OpenAPI freshness, tests with the coverage
# gate, package build. Pure-logic tests also run on Windows. Actions are pinned by commit SHA.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - run: npm run check
      - name: Advisory scan (reports, does not block dev-only issues)
        run: npm audit --omit=dev --audit-level=high
      - name: Build packages
        run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            packaging/out/*.deb
            packaging/out/*.tar.gz
            packaging/out/SHA256SUMS
          retention-days: 14

  windows-pure-logic:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck
      - run: npm test

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by (CONTRIBUTING.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing
