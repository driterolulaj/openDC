# Directories owned by root; services get their own state dirs through StateDirectory=.
d /etc/opendc            0755 root root -
d /etc/opendc/secrets    0700 root root -
d /etc/opendc/registry   0755 root root -
d /etc/opendc/generated  0755 root root -
d /var/lib/opendc        0755 root root -
d /var/lib/opendc/registry 0755 root root -
